name: vessel-tracking

# Every value is overridable from a .env file, which Compose loads automatically;
# the defaults here are what makes `docker compose up` work with no setup at all.
# See .env.example for the full set.
x-app-env: &app-env
  VT_DATABASE_URL: ${VT_DATABASE_URL:-postgresql://vessel:vessel@postgres:5432/vessel_tracking}
  VT_KAFKA_BOOTSTRAP_SERVERS: ${VT_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
  VT_KAFKA_TOPIC: ${VT_KAFKA_TOPIC:-ais.position-reports}
  VT_KAFKA_DEAD_LETTER_TOPIC: ${VT_KAFKA_DEAD_LETTER_TOPIC:-ais.position-reports.dead-letter}
  VT_KAFKA_CONSUMER_GROUP: ${VT_KAFKA_CONSUMER_GROUP:-vessel-tracking}
  VT_FEED_PATH: ${VT_FEED_PATH:-ship_positions.json}
  VT_PRODUCER_RATE: ${VT_PRODUCER_RATE:-200}
  VT_INGEST_BATCH_SIZE: ${VT_INGEST_BATCH_SIZE:-500}
  VT_INGEST_BATCH_SECONDS: ${VT_INGEST_BATCH_SECONDS:-1.0}
  VT_IDLE_TIMEOUT_SECONDS: ${VT_IDLE_TIMEOUT_SECONDS:-0}
  VT_REDIS_URL: ${VT_REDIS_URL:-redis://redis:6379/0}
  VT_RATE_LIMIT_ALLOWANCE: ${VT_RATE_LIMIT_ALLOWANCE:-10}
  VT_RATE_LIMIT_WINDOW_SECONDS: ${VT_RATE_LIMIT_WINDOW_SECONDS:-60}

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${VT_POSTGRES_USER:-vessel}
      POSTGRES_PASSWORD: ${VT_POSTGRES_PASSWORD:-vessel}
      POSTGRES_DB: ${VT_POSTGRES_DB:-vessel_tracking}
    ports: ["5432:5432"]
    volumes:
      - ./db/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VT_POSTGRES_USER:-vessel} -d ${VT_POSTGRES_DB:-vessel_tracking}"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.7.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: kpler-vessel-tracking-0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  consumer:
    build: .
    command: vt-consumer
    environment: *app-env
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    restart: on-failure

  api:
    build: .
    command: uvicorn vessel_tracking.api:create_app --factory --host 0.0.0.0 --port 8000
    environment: *app-env
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 5s
      timeout: 5s
      retries: 20

  # A job, not a service: run it with `docker compose run --rm producer`.
  producer:
    build: .
    command: vt-producer
    environment: *app-env
    profiles: ["tools"]
    depends_on:
      kafka: {condition: service_healthy}
